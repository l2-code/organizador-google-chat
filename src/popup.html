<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="popup.css" />
  <title>Organizar barra lateral do Chat</title>
</head>
<body>
  <header>
    <h1>Organizar barra lateral do Chat</h1>
    <p class="sub">Agrupa os espaços em seções por prefixo do nome.</p>
  </header>

  <!-- Ações principais: sempre visíveis no topo, sem precisar rolar. -->
  <div class="acoes-primarias">
    <button id="btnPreview" class="cta cta-ler">
      <span class="cta-num">1</span>
      <span class="cta-txt">Ler espaços<small>da aba do Chat</small></span>
    </button>
    <button id="btnAplicar" class="cta cta-aplicar" disabled>
      <span class="cta-num">2</span>
      <span class="cta-txt">Aplicar<small>organizar a barra</small></span>
    </button>
  </div>
  <p id="status" class="status"></p>

  <div id="preview" class="preview vazio">
    Abra o Google Chat na aba ativa e clique em <b>Ler espaços</b> aqui em cima.
  </div>

  <!-- Configuração: preset já vem carregado; a maioria não precisa mexer. -->
  <div class="config">
    <button id="btnPreset" class="secundario" title="Carrega a configuração padrão da L2">Preset L2</button>
    <button id="btnImportar" class="secundario">Importar JSON</button>
    <button id="btnExportar" class="secundario">Exportar JSON</button>
    <input type="file" id="arquivo" accept="application/json,.json" hidden />
  </div>

  <details class="avancado">
    <summary>Regras <span class="dica">avançado — a ordem importa, vence a 1ª que casar</span></summary>
    <div id="regras" class="regras"></div>
    <button id="btnAddRegra" class="ghost">+ Adicionar regra</button>
    <label class="sc">
      Sem correspondência (espaço sem prefixo):
      <select id="semCorrespondencia">
        <option value="perguntar">Perguntar na pré-visualização</option>
        <option value="ignorar">Ignorar / deixar quieto</option>
      </select>
    </label>
  </details>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
